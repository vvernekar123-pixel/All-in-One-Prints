<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>All In One Prints | Location, Call, WhatsApp</title>
  <meta name="description" content="All In One Prints, Fatorda, Margao: get directions, call the office or WhatsApp us." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" href="../assets/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--o:#e8701e;--bg:#0b0b0b;--card:#161616;--line:#2a2a2a;--txt:#f4f4f4;--mut:#b5b5b5}
    html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
    body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
      background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(232,112,30,.22),transparent 70%),var(--bg);
      padding:max(28px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
    .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
    .logo{background:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 0 0 3px var(--o),0 10px 40px rgba(232,112,30,.25)}
    .logo img{height:96px;display:block}
    h1{margin-top:22px;font-family:Anton,sans-serif;font-weight:400;font-size:40px;letter-spacing:.01em;text-align:center;line-height:1.05}
    h1 span{color:var(--o)}
    .sub{margin-top:8px;color:var(--mut);font-size:15px;text-align:center}
    .btns{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:14px}
    a.btn{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border-radius:20px;text-decoration:none;color:#fff;
      background:var(--card);border:1px solid var(--line);transition:transform .12s ease,border-color .12s ease;-webkit-tap-highlight-color:transparent}
    a.btn:active{transform:scale(.98)}
    a.btn:hover{border-color:var(--o)}
    .ic{flex:none;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center}
    .ic svg{width:30px;height:30px;fill:#fff}
    .loc .ic{background:var(--o)} .call .ic{background:#2f6fed} .wa .ic{background:#25d366}
    .t{display:flex;flex-direction:column;flex:1;min-width:0}
    .t b{font-size:21px;font-weight:800}
    .t small{margin-top:3px;font-size:14px;color:var(--mut)}
    .arr{flex:none;font-size:24px;color:var(--mut)}
    .addr{margin-top:26px;padding:16px 18px;border-radius:16px;border:1px dashed var(--line);font-size:14px;line-height:1.5;color:var(--mut);text-align:center}
    .addr b{color:var(--txt)}
    .site{margin-top:18px;font-size:15px;font-weight:700;color:var(--txt);text-decoration:none}
    .site span{color:var(--o)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo"><img src="../assets/logo-lockup.png" alt="All In One Prints" /></div>
    <h1>HOW CAN WE <span>HELP?</span></h1>
    <p class="sub">Tap an option below</p>

    <div class="btns">
      <a class="btn loc" href="https://maps.app.goo.gl/22tbWcWdrHFHjGqg8" target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
        <span class="t"><b>Location</b><small>Open directions in Google Maps</small></span><span class="arr">›</span>
      </a>
      <a class="btn call" href="tel:+918767099065">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></span>
        <span class="t"><b>Call</b><small>+91 87670 99065</small></span><span class="arr">›</span>
      </a>
      <a class="btn wa" href="https://wa.me/918329972387?text=Hi%20All%20In%20One%20Prints%2C%20I%20scanned%20your%20QR%20code%20and%20have%20a%20query." target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.5-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.1 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/></svg></span>
        <span class="t"><b>WhatsApp</b><small>+91 83299 72387</small></span><span class="arr">›</span>
      </a>
    </div>

    <p class="addr"><b>All In One Prints</b><br>Shop No. ASH 8, L &amp; L Correia Building, Opp. Mathany Saldanha Administrative Complex, Behind KFC, Fatorda, Margao, Goa 403601</p>
    <a class="site" href="../">allinoneprints<span>goa</span>.com</a>
  </main>
</body>
</html>
